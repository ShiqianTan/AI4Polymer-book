[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4polymer-book-calculations"
version = "0.1.0"
description = "Reproducible quantitative analysis for the AI4Polymer book"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.9,<4"]

[project.scripts]
ai4polymer-calc = "ai4polymer_calc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
