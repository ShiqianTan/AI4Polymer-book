site_name: AI4Polymer：人工智能驱动的高分子材料设计
site_description: 用人工智能方法加速高分子材料的表示、预测、生成与设计
site_url: https://ShiqianTan.github.io/AI4Polymer-book/
repo_url: https://github.com/ShiqianTan/AI4Polymer-book
repo_name: ShiqianTan/AI4Polymer-book
docs_dir: build/docs
site_dir: build/site
use_directory_urls: false
theme:
  name: material
  language: zh
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
plugins:
  - search:
      lang: [zh, en]
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - assets/math.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
extra_css:
  - assets/reading.css
validation:
  links:
    anchors: info
# Placeholder navigation; scripts/build_site.py regenerates it from manuscripts/.
nav:
  - 首页: index.md
  - 前言: manuscripts/00-前言.md
  - 1. 初识 AI4Polymer: manuscripts/01-初识 AI4Polymer.md
  - 2. 高分子表示与描述符: manuscripts/02-高分子表示与描述符.md
  - 3. 数据、基准与可复现性: manuscripts/03-数据、基准与可复现性.md
  - 4. 高分子物理与结构–性能关系: manuscripts/04-高分子物理与结构–性能关系.md
  - 5. 分子模拟与多尺度计算: manuscripts/05-分子模拟与多尺度计算.md
  - 6. 性质预测模型: manuscripts/06-性质预测模型.md
  - 7. 多任务、迁移与物理信息学习: manuscripts/07-多任务、迁移与物理信息学习.md
  - 8. 表征、成像与光谱的 AI 分析: manuscripts/08-表征、成像与光谱的 AI 分析.md
  - 9. 生成模型与高分子序列设计: manuscripts/09-生成模型与高分子序列设计.md
  - 10. 逆向设计与多目标材料设计: manuscripts/10-逆向设计与多目标材料设计.md
  - 11. 主动学习、贝叶斯优化与强化学习: manuscripts/11-主动学习、贝叶斯优化与强化学习.md
  - 12. 反应预测、聚合建模与可合成性: manuscripts/12-反应预测、聚合建模与可合成性.md
  - 13. 自驱动实验室与高通量自动化: manuscripts/13-自驱动实验室与高通量自动化.md
  - 14. 高分子基础模型与智能体系统: manuscripts/14-高分子基础模型与智能体系统.md
  - 15. 可持续高分子与环境应用: manuscripts/15-可持续高分子与环境应用.md
  - 16. 端到端案例与工程实践: manuscripts/16-端到端案例与工程实践.md
