name: 问题与讨论
description: 对书中方法、案例或设计取舍的疑问
labels: [问题]
body:
  - type: input
    id: location
    attributes:
      label: 相关章节
      placeholder: 第 9 章 9.3 节
  - type: textarea
    id: question
    attributes:
      label: 问题
      description: 你的疑问，以及已经尝试过的推算、复现或实验（数据、模型、输入参数）
    validations:
      required: true
