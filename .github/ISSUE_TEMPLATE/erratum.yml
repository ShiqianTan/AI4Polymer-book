name: 勘误
description: 报告正文、公式、图表或数据中的错误
labels: [勘误]
body:
  - type: input
    id: location
    attributes:
      label: 位置
      description: 章节号与小节，或 PDF 页码（请注明 PDF 版本日期）
      placeholder: 第 6 章 6.2.3 节 / PDF 第 123 页
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: 原文
      description: 引用有问题的句子、公式或数字
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 问题与建议
      description: 说明错在哪里，给出建议的修改；涉及数据时请附来源、单位与计算过程
    validations:
      required: true
