name: Build and publish book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication so an older build cannot overwrite a newer deployment.
concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Fetch book figures
        run: git lfs pull --include="manuscripts/**/*.svg,manuscripts/**/*.png,manuscripts/**/*.jpg,manuscripts/**/*.jpeg" --exclude=""
      - name: Enforce Markdown source policy
        run: python scripts/check_no_html.py
      - name: Install website dependencies
        run: pip install -r website/requirements.txt
      - name: Build and check website
        run: |
          python scripts/build_site.py
          python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
      - name: Package website
        run: tar -czf build/ai4polymer-book-site.tar.gz -C build/site .
      - uses: actions/upload-artifact@v7
        with:
          name: book-site-download
          path: build/ai4polymer-book-site.tar.gz
          if-no-files-found: error

  pdf:
    # Match local Apple fonts (Songti SC, Menlo, Arial Unicode MS and Heiti SC).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch PDF figures and fonts
        run: git lfs pull --include="manuscripts/**/*.pdf,manuscripts/**/*.png,manuscripts/figure_style/fonts/**" --exclude=""
      - name: Install Pandoc, XeLaTeX and fonts
        run: |
          brew install texlive poppler ghostscript
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/pandoc.pkg" "https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-$(uname -m)-macOS.pkg"
          sudo installer -pkg "$RUNNER_TEMP/pandoc.pkg" -target /
          # The pinned installer puts Pandoc in /usr/local/bin.
          export PATH="/usr/local/bin:$PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          pandoc --version
          for package in lmodern.sty biblatex.sty pzdr.tfm ctex.sty newtxmath.sty esint.sty adforn.sty fvextra.sty placeins.sty xurl.sty tcolorbox.sty; do
            kpsewhich "$package"
          done
          pip install -r book/requirements-ci.txt
      - name: Check local Mac font parity
        run: python book/check_build_fonts.py
      - name: Build full book PDF
        env:
          BOOK_SOURCE_REF: ${{ github.sha }}
        run: bash book/build_pdf.sh --output-dir ../build/pdf --source-ref "$BOOK_SOURCE_REF"
      - name: Validate PDF and render representative pages
        run: python book/check_ci_pdf.py build/pdf
      - name: Upload PDF release files
        uses: actions/upload-artifact@v7
        with:
          name: book-pdf-download
          if-no-files-found: error
          path: |
            build/pdf/AI4Polymer-Book.pdf
            build/pdf/AI4Polymer-Book-build.json
            build/pdf/AI4Polymer-Book-Cover.pdf
            build/pdf/AI4Polymer-Book-Cover.png
            build/pdf/pdf-validation.json
      - name: Save logs and visual checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-build-diagnostics
          path: |
            book/build/AI4Polymer-Book/*.log
            build/pdf/preview-*.png
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [website, pdf]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: book-pdf-download
          path: dist
      - name: Compose release name
        id: relname
        run: |
          # 按北京时间命名，精确到秒，保证每次发版互不覆盖且一眼可读
          echo "tag=build-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "title=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
      - name: Create release notes
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BUILT_AT: ${{ steps.relname.outputs.title }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          sha = os.environ['SOURCE_SHA']
          repo = os.environ['REPOSITORY']
          built = os.environ['BUILT_AT']
          Path('release-notes.md').write_text(
              f'{built}（北京时间）自动从 main 提交 '
              f'[{sha[:12]}](https://github.com/{repo}/commit/{sha}) 构建。\n\n'
              '下载 `AI4Polymer-Book.pdf` 阅读完整十六章全书。\n\n'
              f'最新版固定链接：https://github.com/{repo}/releases/latest/download/AI4Polymer-Book.pdf\n\n'
              '在线阅读：https://ShiqianTan.github.io/AI4Polymer-book/\n')
          PY
      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          TAG: ${{ steps.relname.outputs.tag }}
          TITLE: ${{ steps.relname.outputs.title }}
        run: |
          # GitHub 的 API 偶有 5xx 抖动，每个调用最多重试五次。
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then return 1; fi
              sleep $((n * 15))
            done
          }
          tag="$TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            retry sh -c 'gh release view "$1" >/dev/null 2>&1 || gh release create "$1" --target "$2" --title "全书 $3" --notes-file release-notes.md --draft' _ "$tag" "$SOURCE_SHA" "$TITLE"
          fi
          retry gh release upload "$tag" dist/AI4Polymer-Book.pdf --clobber
          # Remove legacy build extras if this commit's release is being rerun.
          for asset in AI4Polymer-Book-build.json AI4Polymer-Book-Cover.pdf AI4Polymer-Book-Cover.png ai4polymer-book-site.tar.gz pdf-validation.json SHA256SUMS; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release delete-asset "$tag" "$asset" --yes
            fi
          done
          retry gh release edit "$tag" --notes-file release-notes.md --draft=false --latest

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [website, pdf]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy book
        id: deployment
        uses: actions/deploy-pages@v5
